name: Build Windows .exe

on:
  push:
    tags:
      - 'v*'    # 推送 v1.0.0 tag 自动 build + 发 Release
  workflow_dispatch:    # 手动触发(测试用)
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.1)'
        required: false
        default: 'manual'

# 2026-08-13 修复: 默认 GITHUB_TOKEN 是只读的, softprops/action-gh-release@v2 创建
# release 需要 contents: write 权限. 之前 #7 失败 = "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Build with PyInstaller
        env:
          APP_VERSION: ${{ github.ref_name }}
          # 2026-08-12 修复: GitHub Actions Windows runner 默认 stdout 是 cp1252,
          # build.spec 里 print 中文会 UnicodeEncodeError。强制 utf-8。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          chcp 65001 | Out-Null
          $env:PYTHONIOENCODING = 'utf-8'
          pyinstaller build.spec --clean --noconfirm

      - name: Verify .exe exists
        run: |
          chcp 65001 | Out-Null
          Get-Item dist/客票验真.exe
          if ((Get-Item dist/客票验真.exe).Length -lt 50MB) {
            Write-Error "Build size too small - probably failed"
            exit 1
          }

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        # 2026-08-13 切 ncipollo/release-action@v1: 之前 softprops/action-gh-release@v2
        # 跟中文文件名 + Windows runner 有兼容性问题, 458MB exe 上传后变 245MB default.exe.
        # ncipollo 用 GitHub API 直传 (不走 S3 multipart), 兼容性更稳.
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/客票验真.exe"
          tag: ${{ github.ref_name }}
          artifactErrorsFailBuild: true
          omitBody: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: 客票验真-${{ github.ref_name }}
          path: dist/客票验真.exe
          retention-days: 30
