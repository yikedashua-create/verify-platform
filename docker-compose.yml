version: "3.9"

services:
  verify-platform:
    build: .
    container_name: verify-platform
    ports:
      - "8002:8002"  # 后端 API
      - "8501:8501"  # 前端 Streamlit
    restart: unless-stopped
    # 挂载代码 + 关键数据,改代码不用 rebuild,数据持久化
    volumes:
      - ./:/app
      - playwright-cache:/root/.cache/ms-playwright
    # 健康检查 (可选)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  playwright-cache:
